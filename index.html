<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BE RICH</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

.screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#menu {
    background: linear-gradient(135deg, #111, #292929);
}

.logo {
    font-size: 80px;
    font-weight: bold;
    margin-bottom: 50px;
    letter-spacing: 5px;
}

button {
    width: 300px;
    padding: 17px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

button:hover {
    background: #555;
    transform: scale(1.03);
}

.smallButton {
    width: 180px;
    font-size: 18px;
}

.hidden {
    display: none !important;
}

.panel {
    background: #202020;
    padding: 35px;
    border-radius: 15px;
    width: 500px;
    text-align: center;
}

input, select {
    width: 100%;
    padding: 14px;
    margin: 10px 0 20px;
    background: #111;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 18px;
}

h2 {
    font-size: 35px;
}

.save {
    background: #292929;
    padding: 20px;
    margin: 10px 0;
    border-radius: 10px;
    text-align: left;
}

.save button {
    width: 150px;
    padding: 10px;
    font-size: 16px;
}

#game {
    background: #49613d;
}

#game h1 {
    font-size: 50px;
}

.money {
    font-size: 28px;
}
</style>
</head>

<body>

<!-- MAIN MENU -->

<div id="menu" class="screen">

    <div class="logo">BE RICH</div>

    <button onclick="showPlay()">PLAY</button>
    <button onclick="showNewGame()">NEW GAME</button>
    <button onclick="settings()">SETTINGS</button>
    <button onclick="credits()">CREDITS</button>

</div>


<!-- PLAY / SAVES -->

<div id="playScreen" class="screen hidden">

    <div class="panel">

        <h2>YOUR GAMES</h2>

        <div id="saves"></div>

        <button class="smallButton" onclick="backToMenu()">BACK</button>

    </div>

</div>


<!-- NEW GAME -->

<div id="newGameScreen" class="screen hidden">

    <div class="panel">

        <h2>NEW GAME</h2>

        <label>SERVER NAME</label>

        <input id="serverName" placeholder="My Server">

        <label>PLAYERS</label>

        <select id="playerCount">
            <option value="1">1 Player</option>
            <option value="2">2 Players</option>
            <option value="3">3 Players</option>
        </select>

        <button onclick="playWithFriends()">PLAY WITH FRIENDS</button>

        <button onclick="editSkin()">EDIT SKIN</button>

        <button onclick="createGame()">CREATE GAME</button>

        <button class="smallButton" onclick="backToMenu()">BACK</button>

    </div>

</div>


<!-- GAME -->

<div id="game" class="screen hidden">

    <h1>🚐 BE RICH</h1>

    <div class="money">
        💵 Money: $<span id="money">100</span>
    </div>

    <p id="serverText"></p>

    <p>You are starting in your old camper van.</p>

    <button onclick="leaveGame()">LEAVE GAME</button>

</div>


<script>

let money = 100;


// SHOW PLAY

function showPlay() {

    hideAll();

    document.getElementById("playScreen").classList.remove("hidden");

    loadSaves();
}


// SHOW NEW GAME

function showNewGame() {

    hideAll();

    document.getElementById("newGameScreen").classList.remove("hidden");
}


// CREATE GAME

function createGame() {

    let server = document.getElementById("serverName").value;

    let players = document.getElementById("playerCount").value;

    if (server === "") {
        server = "My Server";
    }

    money = 100;

    let save = {
        name: server,
        money: money,
        players: players
    };

    localStorage.setItem("beRichSave", JSON.stringify(save));

    startGame(server, players);
}


// START GAME

function startGame(server, players) {

    hideAll();

    document.getElementById("game").classList.remove("hidden");

    document.getElementById("money").innerText = money;

    document.getElementById("serverText").innerText =
        "Server: " + server + " | Players: " + players;

}


// LOAD SAVES

function loadSaves() {

    let saves = document.getElementById("saves");

    saves.innerHTML = "";

    let savedGame = localStorage.getItem("beRichSave");

    if (!savedGame) {

        saves.innerHTML =
            "<p>No saved games yet.</p>";

        return;
    }

    let save = JSON.parse(savedGame);

    let div = document.createElement("div");

    div.className = "save";

    div.innerHTML =
        "<b>" + save.name + "</b><br>" +
        "💵 Money: $" + save.money + "<br>" +
        "👥 Players: " + save.players;

    let button = document.createElement("button");

    button.innerText = "PLAY";

    button.onclick = function() {

        money = save.money;

        startGame(save.name, save.players);

    };

    div.appendChild(button);

    saves.appendChild(div);
}


// PLAY WITH FRIENDS

function playWithFriends() {

    alert(
        "Multiplayer kjem snart! 👥\n\n" +
        "Her skal du seinare få ein serverkode som vennene dine kan bruke."
    );

}


// EDIT SKIN

function editSkin() {

    alert(
        "SKIN EDITOR kjem snart! 👤\n\n" +
        "Her skal du kunne lage karakteren din."
    );

}


// SETTINGS

function settings() {

    alert("Settings kjem snart! ⚙️");

}


// CREDITS

function credits() {

    alert(
        "BE RICH\n\n" +
        "Created by you 😎"
    );

}


// LEAVE GAME

function leaveGame() {

    saveGame();

    backToMenu();

}


// SAVE GAME

function saveGame() {

    let server =
        document.getElementById("serverText").innerText;

    localStorage.setItem(
        "beRichSave",
        JSON.stringify({
            name: server,
            money: money,
            players: 1
        })
    );

}


// BACK TO MENU

function backToMenu() {

    hideAll();

    document.getElementById("menu").classList.remove("hidden");

}


// HIDE ALL SCREENS

function hideAll() {

    document.getElementById("menu").classList.add("hidden");

    document.getElementById("playScreen").classList.add("hidden");

    document.getElementById("newGameScreen").classList.add("hidden");

    document.getElementById("game").classList.add("hidden");

}

</script>

</body>
</html>
