<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE RICH</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07090d;
    --panel: rgba(15, 18, 25, 0.88);
    --panel2: rgba(25, 29, 38, 0.92);
    --white: #f5f7fa;
    --muted: #aab2c0;
    --accent: #62ff9b;
    --accent2: #37c9ff;
    --danger: #ff4f5e;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #07090d;
    color: var(--white);
    overflow: hidden;
}

/* =========================================================
   GENERAL
========================================================= */

.hidden {
    display: none !important;
}

.screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 35%, #263447 0%, #10151d 38%, #06080c 80%);
    z-index: -10;
}

.background::before {
    content: "";
    position: absolute;
    width: 900px;
    height: 900px;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(circle, rgba(98,255,155,0.12), transparent 58%);
    filter: blur(30px);
    animation: pulse 5s ease-in-out infinite;
}

.background::after {
    content: "";
    position: absolute;
    inset: -100px;
    background:
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(255,255,255,0.025) 45%,
            transparent 50%
        );
    transform: translateX(-60%);
    animation: shine 8s linear infinite;
}

@keyframes pulse {
    0%,100% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.5;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 1;
    }
}

@keyframes shine {
    to {
        transform: translateX(60%);
    }
}

/* floating dots */

.dots {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.dot {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: 0.25;
    animation: floatDot linear infinite;
}

.dot:nth-child(1) { left: 8%; top: 20%; animation-duration: 8s; }
.dot:nth-child(2) { left: 18%; top: 70%; animation-duration: 11s; }
.dot:nth-child(3) { left: 32%; top: 35%; animation-duration: 9s; }
.dot:nth-child(4) { left: 48%; top: 80%; animation-duration: 12s; }
.dot:nth-child(5) { left: 61%; top: 24%; animation-duration: 10s; }
.dot:nth-child(6) { left: 75%; top: 62%; animation-duration: 8s; }
.dot:nth-child(7) { left: 88%; top: 30%; animation-duration: 13s; }
.dot:nth-child(8) { left: 93%; top: 82%; animation-duration: 9s; }

@keyframes floatDot {
    0% {
        transform: translateY(0);
        opacity: 0.15;
    }

    50% {
        transform: translateY(-35px);
        opacity: 0.5;
    }

    100% {
        transform: translateY(0);
        opacity: 0.15;
    }
}

/* =========================================================
   MAIN MENU
========================================================= */

#menu {
    flex-direction: column;
    text-align: center;
}

.logo {
    font-size: clamp(58px, 9vw, 110px);
    font-weight: 1000;
    letter-spacing: 8px;
    margin-bottom: 10px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #c8d2dc 42%,
            #62ff9b 100%
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter:
        drop-shadow(0 8px 20px rgba(0,0,0,0.8));

    animation: logoFloat 4s ease-in-out infinite;
}

.subtitle {
    color: #9ea9b8;
    letter-spacing: 5px;
    font-size: 14px;
    margin-bottom: 45px;
    text-transform: uppercase;
}

@keyframes logoFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}

/* =========================================================
   BUTTONS
========================================================= */

.menu-button {
    width: 330px;
    max-width: 85vw;
    padding: 17px 22px;
    margin: 6px;

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;

    background:
        linear-gradient(
            180deg,
            rgba(44,50,62,0.95),
            rgba(20,24,31,0.95)
        );

    color: white;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.06);

    transition:
        transform 0.15s,
        border-color 0.15s,
        box-shadow 0.15s,
        background 0.15s;
}

.menu-button:hover {
    transform: translateY(-3px) scale(1.02);

    border-color: rgba(98,255,155,0.45);

    box-shadow:
        0 12px 35px rgba(0,0,0,0.5),
        0 0 25px rgba(98,255,155,0.08);

    background:
        linear-gradient(
            180deg,
            rgba(53,63,76,1),
            rgba(23,29,37,1)
        );
}

.menu-button:active {
    transform: translateY(1px);
}

/* =========================================================
   PANELS
========================================================= */

.panel {
    width: 560px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;

    padding: 34px;

    background:
        linear-gradient(
            145deg,
            rgba(31,37,48,0.95),
            rgba(10,13,18,0.95)
        );

    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 30px 90px rgba(0,0,0,0.65),
        inset 0 1px rgba(255,255,255,0.06);

    backdrop-filter: blur(14px);
}

.panel h2 {
    margin-top: 0;
    margin-bottom: 28px;
    font-size: 34px;
}

.panel-title-small {
    color: var(--muted);
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 15px;

    margin: 8px 0 20px;

    border: 1px solid #3b4350;
    border-radius: 10px;

    background: #090c11;
    color: white;

    font-size: 17px;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(98,255,155,0.08);
}

label {
    display: block;
    text-align: left;
    color: #aeb8c6;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* =========================================================
   SAVES
========================================================= */

.saves-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 22px;
}

.save {
    position: relative;

    padding: 18px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(44,50,62,0.95),
            rgba(20,24,31,0.95)
        );

    border: 1px solid rgba(255,255,255,0.07);

    text-align: left;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.3);

    transition: transform 0.15s, border-color 0.15s;
}

.save:hover {
    transform: translateY(-2px);
    border-color: rgba(98,255,155,0.25);
}

.save-name {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 7px;
}

.save-info {
    color: #aab3c0;
    font-size: 14px;
    line-height: 1.7;
}

.save-actions {
    display: flex;
    gap: 8px;
    margin-top: 13px;
    flex-wrap: wrap;
}

.small-button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: bold;
    background: #303846;
}

.small-button:hover {
    background: #455064;
}

.delete-button {
    background: #8e2733;
}

.delete-button:hover {
    background: #b93342;
}

.no-saves {
    padding: 30px 10px;
    color: #7f8998;
}

.save-count {
    color: #778294;
    font-size: 13px;
    margin-top: 5px;
}

/* =========================================================
   GAME WORLD
========================================================= */

#game {
    display: none;
    background: #071016;
}

.game-world {
    position: absolute;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #15293c 0%,
            #29495a 42%,
            #536c48 43%,
            #34462f 100%
        );
}

/* moon/sun */

.sky-light {
    position: absolute;
    width: 150px;
    height: 150px;
    right: 11%;
    top: 10%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff6c9 0%,
            #dbe7c8 45%,
            rgba(255,255,255,0) 72%
        );

    filter: blur(1px);
}

/* mountains */

.mountain {
    position: absolute;
    bottom: 36%;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 260px solid #253b38;
    opacity: 0.9;
}

.mountain.one {
    left: -40px;
}

.mountain.two {
    left: 25%;
    transform: scale(1.25);
    border-bottom-color: #203430;
}

.mountain.three {
    right: -70px;
    transform: scale(1.1);
    border-bottom-color: #29403a;
}

/* ground */

.world-ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 43%;

    background:
        radial-gradient(
            ellipse at center,
            #63794f 0%,
            #415439 45%,
            #263528 100%
        );
}

/* road */

.road {
    position: absolute;
    width: 100%;
    height: 110px;
    bottom: 9%;

    background:
        linear-gradient(
            180deg,
            #343b3d,
            #242a2c
        );

    box-shadow:
        inset 0 8px 0 rgba(255,255,255,0.04),
        inset 0 -8px 0 rgba(0,0,0,0.2);
}

.road-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 49px;
    height: 6px;

    background:
        repeating-linear-gradient(
            90deg,
            #c7b86b 0 55px,
            transparent 55px 105px
        );

    opacity: 0.55;
}

/* =========================================================
   CAMPER
========================================================= */

.camper-shadow {
    position: absolute;
    width: 600px;
    height: 80px;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);

    background: rgba(0,0,0,0.35);
    filter: blur(15px);
    border-radius: 50%;
}

.camper {
    position: absolute;

    width: 540px;
    height: 285px;

    left: 50%;
    bottom: 25%;

    transform: translateX(-50%);

    background:
        linear-gradient(
            180deg,
            #eee9dc 0%,
            #d0c8b8 55%,
            #aaa28f 100%
        );

    border: 8px solid #252a2c;

    border-radius: 42px 42px 18px 18px;

    box-shadow:
        0 22px 45px rgba(0,0,0,0.45),
        inset 0 2px rgba(255,255,255,0.6);
}

.camper-roof {
    position: absolute;
    left: 25px;
    top: -28px;

    width: 465px;
    height: 32px;

    background: #20262a;
    border-radius: 20px;

    box-shadow: 0 5px 12px rgba(0,0,0,0.35);
}

.camper-stripe {
    position: absolute;
    left: 0;
    top: 145px;
    width: 100%;
    height: 32px;

    background:
        linear-gradient(
            90deg,
            #263b4d,
            #456c82,
            #263b4d
        );
}

.window {
    position: absolute;
    top: 43px;

    width: 115px;
    height: 88px;

    background:
        linear-gradient(
            135deg,
            #162e3c,
            #3d7288
        );

    border: 6px solid #20282c;
    border-radius: 13px;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,0.08);
}

.window.left {
    left: 42px;
}

.window.right {
    right: 42px;
}

.door {
    position: absolute;

    right: 165px;
    bottom: 0;

    width: 105px;
    height: 185px;

    background:
        linear-gradient(
            90deg,
            #aaa594,
            #c9c4b4,
            #aaa594
        );

    border: 6px solid #292e30;
    border-bottom: 0;

    border-radius: 12px 12px 0 0;
}

.door-window {
    position: absolute;
    width: 65px;
    height: 60px;
    left: 14px;
    top: 15px;
    background: #31596a;
    border: 4px solid #262c30;
    border-radius: 7px;
}

.door-handle {
    position: absolute;
    right: 12px;
    top: 92px;

    width: 13px;
    height: 13px;

    background: #1c2022;
    border-radius: 50%;
}

.wheel {
    position: absolute;

    bottom: -45px;

    width: 82px;
    height: 82px;

    background: #111518;

    border: 11px solid #292e32;

    border-radius: 50%;

    box-shadow:
        inset 0 0 0 7px #080a0b;
}

.wheel.left {
    left: 70px;
}

.wheel.right {
    right: 70px;
}

/* =========================================================
   PLAYER
========================================================= */

.player {
    position: absolute;

    left: 50%;
    bottom: 28%;

    transform: translateX(-50%);

    width: 65px;
    height: 115px;

    z-index: 15;

    transition: left 0.08s, bottom 0.08s;
}

.player-head {
    width: 52px;
    height: 52px;

    margin: auto;

    background: #e5b28d;

    border: 4px solid #222;

    border-radius: 50%;

    box-shadow:
        0 5px 10px rgba(0,0,0,0.35);
}

.player-body {
    width: 46px;
    height: 56px;

    margin: -1px auto 0;

    background:
        linear-gradient(
            180deg,
            #486f9b,
            #2c4c70
        );

    border: 4px solid #222;

    border-radius: 12px 12px 8px 8px;
}

.player-name {
    position: absolute;

    top: -32px;
    left: 50%;

    transform: translateX(-50%);

    white-space: nowrap;

    padding: 5px 9px;

    border-radius: 6px;

    background: rgba(0,0,0,0.65);

    font-size: 13px;
    font-weight: bold;
}

/* =========================================================
   HUD
========================================================= */

#hud {
    position: absolute;

    top: 22px;
    left: 22px;

    z-index: 50;

    padding: 13px 19px;

    border-radius: 12px;

    background: rgba(4,7,10,0.78);

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.35);

    font-size: 24px;
    font-weight: bold;
}

#serverHud {
    position: absolute;

    top: 22px;
    right: 22px;

    z-index: 50;

    padding: 11px 15px;

    border-radius: 10px;

    background: rgba(4,7,10,0.7);

    color: #b9c2ce;

    font-size: 14px;
}

/* =========================================================
   GAME BUTTON
========================================================= */

.exit-button {
    position: absolute;

    right: 25px;
    bottom: 25px;

    z-index: 60;

    padding: 14px 23px;

    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 10px;

    background: rgba(16,20,25,0.9);

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.exit-button:hover {
    background: #2d3640;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .logo {
        letter-spacing: 4px;
    }

    .panel {
        padding: 22px;
    }

    .camper {
        transform: translateX(-50%) scale(0.65);
        transform-origin: bottom center;
    }

    .camper-shadow {
        transform: translateX(-50%) scale(0.65);
    }

    .player {
        transform: translateX(-50%) scale(0.8);
    }

    #hud {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>


<!-- =====================================================
     MAIN MENU
===================================================== -->

<div id="menu" class="screen">

    <div class="logo">
        BE RICH
    </div>

    <div class="subtitle">
        Start with nothing. Become rich.
    </div>

    <button class="menu-button" onclick="showPlay()">
        ▶ PLAY
    </button>

    <button class="menu-button" onclick="showNewGame()">
        ＋ NEW GAME
    </button>

    <button class="menu-button" onclick="settings()">
        ⚙ SETTINGS
    </button>

    <button class="menu-button" onclick="credits()">
        ★ CREDITS
    </button>

</div>


<!-- =====================================================
     PLAY
===================================================== -->

<div id="playScreen" class="screen hidden">

    <div class="panel">

        <h2>YOUR GAMES</h2>

        <div id="saves" class="saves-list"></div>

        <button class="menu-button" onclick="backToMenu()">
            ← BACK
        </button>

    </div>

</div>


<!-- =====================================================
     NEW GAME
===================================================== -->

<div id="newGameScreen" class="screen hidden">

    <div class="panel">

        <h2>NEW GAME</h2>

        <div class="panel-title-small">
            Create your own server
        </div>

        <label for="serverName">
            SERVER NAME
        </label>

        <input
            id="serverName"
            placeholder="My Server"
            maxlength="30"
        >

        <label for="playerCount">
            PLAYERS
        </label>

        <select id="playerCount">

            <option value="1">
                1 Player
            </option>

            <option value="2">
                2 Players
            </option>

            <option value="3">
                3 Players
            </option>

        </select>

        <button
            class="menu-button"
            onclick="playWithFriends()">
            👥 PLAY WITH FRIENDS
        </button>

        <button
            class="menu-button"
            onclick="editSkin()">
            👤 EDIT SKIN
        </button>

        <button
            class="menu-button"
            onclick="createGame()">
            🚀 CREATE GAME
        </button>

        <button
            class="menu-button"
            onclick="backToMenu()">
            ← BACK
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game" class="screen">

    <div class="game-world">

        <div class="sky-light"></div>

        <div class="mountain one"></div>
        <div class="mountain two"></div>
        <div class="mountain three"></div>

        <div class="world-ground"></div>

        <div class="road">
            <div class="road-line"></div>
        </div>

        <div class="camper-shadow"></div>

        <div class="camper">

            <div class="camper-roof"></div>

            <div class="window left"></div>
            <div class="window right"></div>

            <div class="camper-stripe"></div>

            <div class="door">

                <div class="door-window"></div>

                <div class="door-handle"></div>

            </div>

            <div class="wheel left"></div>
            <div class="wheel right"></div>

        </div>


        <div id="player" class="player">

            <div id="playerName" class="player-name">
                Player 1
            </div>

            <div class="player-head"></div>

            <div class="player-body"></div>

        </div>

    </div>


    <div id="hud">
        💵 $<span id="money">100</span>
    </div>

    <div id="serverHud">
        Server
    </div>

    <button
        class="exit-button"
        onclick="leaveGame()">
        🚪 SAVE & EXIT
    </button>

</div>


<script>

/* =========================================================
   GAME DATA
========================================================= */

let currentSaveId = null;
let money = 100;
let currentServerName = "My Server";
let currentPlayers = 1;


/* =========================================================
   SAVE SYSTEM
========================================================= */

/*
   All games are stored in one array.

   Example:

   [
      { id: "...", name: "My Server", money: 100, players: 1 },
      { id: "...", name: "Friends", money: 500, players: 3 }
   ]
*/

function getSaves() {

    let data =
        localStorage.getItem("beRichSaves");

    if (!data) {
        return [];
    }

    try {

        let saves = JSON.parse(data);

        if (!Array.isArray(saves)) {
            return [];
        }

        return saves;

    } catch {

        return [];
    }
}


function saveAllSaves(saves) {

    localStorage.setItem(
        "beRichSaves",
        JSON.stringify(saves)
    );
}


/* =========================================================
   OLD SAVE MIGRATION
========================================================= */

function migrateOldSave() {

    let oldSave =
        localStorage.getItem("beRichSave");

    let newSaves =
        localStorage.getItem("beRichSaves");


    if (!oldSave || newSaves) {
        return;
    }


    try {

        let old =
            JSON.parse(oldSave);

        let converted = {

            id:
                Date.now().toString(),

            name:
                old.name || "My Server",

            money:
                Number(old.money) || 100,

            players:
                Number(old.players) || 1

        };


        saveAllSaves([converted]);

        localStorage.removeItem("beRichSave");

    } catch {

        localStorage.removeItem("beRichSave");

    }
}


/* =========================================================
   SCREEN FUNCTIONS
========================================================= */

function hideAll() {

    document
        .getElementById("menu")
        .classList.add("hidden");

    document
        .getElementById("playScreen")
        .classList.add("hidden");

    document
        .getElementById("newGameScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.add("hidden");
}


function backToMenu() {

    hideAll();

    document
        .getElementById("menu")
        .classList.remove("hidden");
}


/* =========================================================
   PLAY
========================================================= */

function showPlay() {

    hideAll();

    document
        .getElementById("playScreen")
        .classList.remove("hidden");

    loadSaves();
}


/* =========================================================
   NEW GAME
========================================================= */

function showNewGame() {

    hideAll();

    document
        .getElementById("newGameScreen")
        .classList.remove("hidden");

    document
        .getElementById("serverName")
        .focus();
}


/* =========================================================
   CREATE GAME
========================================================= */

function createGame() {

    let server =
        document
            .getElementById("serverName")
            .value
            .trim();


    let players =
        Number(
            document
                .getElementById("playerCount")
                .value
        );


    if (server === "") {

        server = "My Server";

    }


    money = 100;


    let newSave = {

        id:
            Date.now().toString()
            +
            Math.random()
                .toString(36)
                .substring(2),

        name:
            server,

        money:
            money,

        players:
            players

    };


    let saves =
        getSaves();


    saves.push(newSave);


    saveAllSaves(saves);


    currentSaveId =
        newSave.id;

    currentServerName =
        newSave.name;

    currentPlayers =
        newSave.players;


    startGame();
}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    hideAll();

    document
        .getElementById("game")
        .classList.remove("hidden");


    document
        .getElementById("money")
        .innerText =
            money;


    document
        .getElementById("serverHud")
        .innerText =
            currentServerName
            +
            " • "
            +
            currentPlayers
            +
            " Player"
            +
            (currentPlayers === 1 ? "" : "s");


    document
        .getElementById("playerName")
        .innerText =
            "Player 1";
}


/* =========================================================
   LOAD ALL SAVES
========================================================= */

function loadSaves() {

    let savesContainer =
        document
            .getElementById("saves");


    savesContainer.innerHTML = "";


    let saves =
        getSaves();


    if (saves.length === 0) {

        savesContainer.innerHTML =

            '<div class="no-saves">' +

            '<div style="font-size:40px;">🎮</div>' +

            '<div style="font-size:18px;margin-top:10px;">' +
            'No saved games yet' +
            '</div>' +

            '<div class="save-count">' +
            'Create a new game to get started.' +
            '</div>' +

            '</div>';

        return;
    }


    saves.forEach(function(save) {

        let div =
            document
                .createElement("div");

        div.className =
            "save";


        let name =
            document
                .createElement("div");

        name.className =
            "save-name";

        name.innerText =
            "🎮 " + save.name;


        let info =
            document
                .createElement("div");

        info.className =
            "save-info";

        info.innerHTML =

            "💵 Money: $" +
            Number(save.money).toLocaleString() +

            "<br>" +

            "👥 Players: " +
            save.players;


        let actions =
            document
                .createElement("div");

        actions.className =
            "save-actions";


        /* PLAY */

        let playButton =
            document
                .createElement("button");

        playButton.className =
            "small-button";

        playButton.innerText =
            "▶ PLAY";


        playButton.onclick =
            function() {

                openSave(save.id);

            };


        /* DELETE */

        let deleteButton =
            document
                .createElement("button");

        deleteButton.className =
            "small-button delete-button";

        deleteButton.innerText =
            "🗑 DELETE";


        deleteButton.onclick =
            function() {

                deleteSave(save.id);

            };


        actions.appendChild(
            playButton
        );

        actions.appendChild(
            deleteButton
        );


        div.appendChild(name);

        div.appendChild(info);

        div.appendChild(actions);


        savesContainer.appendChild(div);

    });

}


/* =========================================================
   OPEN SAVE
========================================================= */

function openSave(id) {

    let saves =
        getSaves();


    let save =
        saves.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!save) {

        alert(
            "This save could not be found."
        );

        loadSaves();

        return;
    }


    currentSaveId =
        save.id;

    currentServerName =
        save.name;

    currentPlayers =
        Number(save.players) || 1;

    money =
        Number(save.money) || 100;


    startGame();
}


/* =========================================================
   DELETE SAVE
========================================================= */

function deleteSave(id) {

    let saves =
        getSaves();


    let save =
        saves.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!save) {
        return;
    }


    let answer =
        confirm(
            'Delete "' +
            save.name +
            '"?\n\nThis cannot be undone.'
        );


    if (!answer) {
        return;
    }


    let remaining =
        saves.filter(
            function(item) {

                return item.id !== id;

            }
        );


    saveAllSaves(
        remaining
    );


    loadSaves();
}


/* =========================================================
   SAVE CURRENT GAME
========================================================= */

function saveCurrentGame() {

    if (!currentSaveId) {
        return;
    }


    let saves =
        getSaves();


    let save =
        saves.find(
            function(item) {

                return item.id === currentSaveId;

            }
        );


    if (!save) {
        return;
    }


    save.money =
        money;


    save.name =
        currentServerName;


    save.players =
        currentPlayers;


    saveAllSaves(
        saves
    );
}


/* =========================================================
   LEAVE GAME
========================================================= */

function leaveGame() {

    saveCurrentGame();

    backToMenu();
}
