<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>BE RICH</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    #menu {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(#151515, #292929);
    }

    h1 {
        font-size: 70px;
        margin-bottom: 50px;
    }

    button {
        width: 260px;
        padding: 18px;
        margin: 8px;
        font-size: 22px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        transform: scale(1.05);
    }

    #game {
        display: none;
        height: 100vh;
        padding-top: 60px;
        box-sizing: border-box;
        background: #526b42;
    }

    #camper {
        margin: 40px auto;
        width: 500px;
        height: 250px;
        background: #ddd;
        border: 8px solid #444;
        border-radius: 20px;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    #money {
        font-size: 30px;
        margin: 20px;
    }
</style>
</head>

<body>

<!-- HOVUDMENY -->
<div id="menu">

    <h1>💰 BE RICH</h1>

    <button onclick="startGame()">PLAY</button>
    <button onclick="newGame()">NEW GAME</button>
    <button onclick="settings()">SETTINGS</button>
    <button onclick="credits()">CREDITS</button>

</div>


<!-- SPELET -->
<div id="game">

    <h2>BE RICH</h2>

    <div id="money">💵 Money: $100</div>

    <div id="camper">
        🚐<br>
        DIN GAMLE CAMPINGBIL
    </div>

    <button onclick="getOut()">GET OUT</button>

</div>


<script>

let money = 100;


// START SPELET
function startGame() {

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";

}


// NYTT SPEL
function newGame() {

    money = 100;

    alert("Nytt spel starta! Du har $100.");

    startGame();

}


// SETTINGS
function settings() {

    alert("Settings kjem snart!");

}


// CREDITS
function credits() {

    alert("BE RICH\nLaga av deg 😎");

}


// GÅ UT AV CAMPINGBILEN
function getOut() {

    alert("Du går ut av campingbilen! 🚶\nNo må du finne ein måte å tene pengar på.");

}

</script>

</body>
</html>
